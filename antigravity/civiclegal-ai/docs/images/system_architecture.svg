<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="580" viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e6da4"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="580" fill="#f8fafc" rx="12"/>
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a3a5c">CivicLegal AI — System Architecture</text>
  <text x="450" y="58" text-anchor="middle" font-size="11" fill="#666">DEMO DATA – Legal Information Only, Not Legal Advice</text>

  <!-- User Layer -->
  <rect x="30" y="80" width="840" height="80" rx="8" fill="#e8f4fd" stroke="#2e6da4" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">User Layer</text>
  <rect x="160" y="112" width="180" height="36" rx="6" fill="#2e6da4"/>
  <text x="250" y="135" text-anchor="middle" font-size="12" fill="white">Citizen / End User</text>
  <rect x="380" y="112" width="180" height="36" rx="6" fill="#2e6da4"/>
  <text x="470" y="135" text-anchor="middle" font-size="12" fill="white">Web Browser / Mobile</text>
  <rect x="600" y="112" width="180" height="36" rx="6" fill="#2e6da4"/>
  <text x="690" y="135" text-anchor="middle" font-size="12" fill="white">REST API Clients</text>

  <!-- Arrows down -->
  <line x1="450" y1="160" x2="450" y2="185" stroke="#2e6da4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Frontend Layer -->
  <rect x="30" y="185" width="840" height="70" rx="8" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">Frontend — Streamlit (app.py)</text>
  <rect x="80" y="213" width="160" height="30" rx="5" fill="#27ae60"/>
  <text x="160" y="233" text-anchor="middle" font-size="11" fill="white">Legal Navigator Tab</text>
  <rect x="260" y="213" width="140" height="30" rx="5" fill="#27ae60"/>
  <text x="330" y="233" text-anchor="middle" font-size="11" fill="white">Benefits Finder Tab</text>
  <rect x="420" y="213" width="150" height="30" rx="5" fill="#27ae60"/>
  <text x="495" y="233" text-anchor="middle" font-size="11" fill="white">Upload Document Tab</text>
  <rect x="590" y="213" width="130" height="30" rx="5" fill="#27ae60"/>
  <text x="655" y="233" text-anchor="middle" font-size="11" fill="white">About Tab</text>
  <rect x="740" y="213" width="110" height="30" rx="5" fill="#27ae60"/>
  <text x="795" y="233" text-anchor="middle" font-size="11" fill="white">Sidebar/Auth</text>

  <!-- Arrow -->
  <line x1="450" y1="255" x2="450" y2="280" stroke="#2e6da4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Backend Layer -->
  <rect x="30" y="280" width="840" height="90" rx="8" fill="#fff3e0" stroke="#e67e22" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">Backend — FastAPI (main.py)</text>
  <rect x="60" y="307" width="175" height="50" rx="5" fill="#e67e22"/>
  <text x="147" y="328" text-anchor="middle" font-size="11" fill="white">GET /health</text>
  <text x="147" y="345" text-anchor="middle" font-size="10" fill="#ffe0b2">System Status</text>
  <rect x="253" y="307" width="175" height="50" rx="5" fill="#e67e22"/>
  <text x="340" y="328" text-anchor="middle" font-size="11" fill="white">POST /legal-query</text>
  <text x="340" y="345" text-anchor="middle" font-size="10" fill="#ffe0b2">RAG + LLM</text>
  <rect x="446" y="307" width="175" height="50" rx="5" fill="#e67e22"/>
  <text x="533" y="328" text-anchor="middle" font-size="11" fill="white">POST /benefits-match</text>
  <text x="533" y="345" text-anchor="middle" font-size="10" fill="#ffe0b2">Eligibility Engine</text>
  <rect x="639" y="307" width="200" height="50" rx="5" fill="#e67e22"/>
  <text x="739" y="328" text-anchor="middle" font-size="11" fill="white">POST /upload-document</text>
  <text x="739" y="345" text-anchor="middle" font-size="10" fill="#ffe0b2">PDF/DOCX Ingestion</text>

  <!-- Arrow -->
  <line x1="450" y1="370" x2="450" y2="395" stroke="#2e6da4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RAG Layer -->
  <rect x="30" y="395" width="540" height="80" rx="8" fill="#f3e5f5" stroke="#8e44ad" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="300" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">RAG Pipeline</text>
  <rect x="50" y="422" width="120" height="40" rx="5" fill="#8e44ad"/>
  <text x="110" y="446" text-anchor="middle" font-size="11" fill="white">BM25 Retrieval</text>
  <rect x="190" y="422" width="120" height="40" rx="5" fill="#8e44ad"/>
  <text x="250" y="446" text-anchor="middle" font-size="11" fill="white">Vector Search</text>
  <rect x="330" y="422" width="130" height="40" rx="5" fill="#8e44ad"/>
  <text x="395" y="446" text-anchor="middle" font-size="11" fill="white">Cross-Encoder Rerank</text>
  <rect x="478" y="422" width="80" height="40" rx="5" fill="#8e44ad"/>
  <text x="518" y="446" text-anchor="middle" font-size="11" fill="white">HGuard</text>

  <!-- Data Sources -->
  <rect x="590" y="395" width="280" height="80" rx="8" fill="#fce4ec" stroke="#c0392b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="730" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">Data Sources / APIs</text>
  <rect x="600" y="422" width="110" height="40" rx="5" fill="#c0392b"/>
  <text x="655" y="437" text-anchor="middle" font-size="10" fill="white">CourtListener</text>
  <text x="655" y="452" text-anchor="middle" font-size="10" fill="#ffcdd2">Congress.gov</text>
  <rect x="730" y="422" width="125" height="40" rx="5" fill="#c0392b"/>
  <text x="792" y="437" text-anchor="middle" font-size="10" fill="white">Regulations.gov</text>
  <text x="792" y="452" text-anchor="middle" font-size="10" fill="#ffcdd2">Benefits.gov</text>

  <!-- LLM -->
  <rect x="200" y="495" width="500" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="515" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">LLM Layer (Temperature = 0)</text>
  <rect x="220" y="522" width="140" height="30" rx="5" fill="#1565c0"/>
  <text x="290" y="542" text-anchor="middle" font-size="11" fill="white">GPT-4 (OpenAI)</text>
  <rect x="380" y="522" width="160" height="30" rx="5" fill="#1565c0"/>
  <text x="460" y="542" text-anchor="middle" font-size="11" fill="white">Mistral 7B (Ollama)</text>
  <rect x="560" y="522" width="130" height="30" rx="5" fill="#1565c0"/>
  <text x="625" y="542" text-anchor="middle" font-size="11" fill="white">Demo Fallback</text>

  <line x1="300" y1="475" x2="350" y2="495" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="730" y1="475" x2="600" y2="495" stroke="#2e6da4" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
