<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="a3r" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#f8fafc" rx="12"/>
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a3a5c">Benefits Matching Flow</text>
  <text x="400" y="55" text-anchor="middle" font-size="10" fill="#888">SNAP · Medicaid · CHIP · WIC · TANF · Section 8 · SSI · SSDI · EITC · LIHEAP</text>

  <!-- Input -->
  <rect x="290" y="70" width="220" height="70" rx="8" fill="#2e6da4"/>
  <text x="400" y="96" text-anchor="middle" font-size="13" fill="white" font-weight="bold">User Profile Input</text>
  <text x="400" y="112" text-anchor="middle" font-size="10" fill="#b3d1f0">Household size · Income · State</text>
  <text x="400" y="126" text-anchor="middle" font-size="10" fill="#b3d1f0">Children · Disability · Veteran · Age</text>
  <line x1="400" y1="140" x2="400" y2="168" stroke="#27ae60" stroke-width="2" marker-end="url(#a3)"/>

  <!-- FPL Calc -->
  <rect x="290" y="168" width="220" height="55" rx="8" fill="#8e44ad"/>
  <text x="400" y="191" text-anchor="middle" font-size="12" fill="white" font-weight="bold">FPL Calculation</text>
  <text x="400" y="207" text-anchor="middle" font-size="10" fill="#e1bee7">Income ÷ Federal Poverty Level 2024</text>
  <line x1="400" y1="223" x2="400" y2="250" stroke="#27ae60" stroke-width="2" marker-end="url(#a3)"/>

  <!-- Program loop -->
  <rect x="240" y="250" width="320" height="55" rx="8" fill="#e67e22"/>
  <text x="400" y="272" text-anchor="middle" font-size="12" fill="white" font-weight="bold">For Each Program (10 total)</text>
  <text x="400" y="288" text-anchor="middle" font-size="10" fill="#ffe0b2">Income threshold · Special requirements · Age</text>

  <!-- Decision diamond -->
  <polygon points="400,325 480,360 400,395 320,360" fill="#1565c0" stroke="white" stroke-width="1.5"/>
  <text x="400" y="356" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Eligible?</text>

  <!-- Yes path -->
  <line x1="480" y1="360" x2="600" y2="360" stroke="#27ae60" stroke-width="2" marker-end="url(#a3)"/>
  <text x="540" y="352" text-anchor="middle" font-size="10" fill="#27ae60" font-weight="bold">YES</text>
  <rect x="600" y="330" width="160" height="60" rx="8" fill="#27ae60"/>
  <text x="680" y="355" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Add to Results</text>
  <text x="680" y="371" text-anchor="middle" font-size="10" fill="#e8f5e9">with reason + docs</text>

  <!-- No path -->
  <line x1="320" y1="360" x2="200" y2="360" stroke="#c0392b" stroke-width="2" marker-end="url(#a3r)"/>
  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">NO</text>
  <rect x="50" y="330" width="150" height="60" rx="8" fill="#c0392b"/>
  <text x="125" y="355" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Skip Program</text>
  <text x="125" y="371" text-anchor="middle" font-size="10" fill="#ffcdd2">with reason logged</text>

  <!-- Loop back -->
  <path d="M 680 390 Q 680 425 400 425 Q 240 425 240 310 Q 240 275 250 265" fill="none" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a3)"/>
  <text x="680" y="420" text-anchor="middle" font-size="9" fill="#8e44ad">next program</text>

  <!-- Output -->
  <rect x="230" y="440" width="340" height="48" rx="8" fill="#1a3a5c"/>
  <text x="400" y="461" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Final Results + Disclaimer</text>
  <text x="400" y="477" text-anchor="middle" font-size="10" fill="#b3d1f0">Sorted eligible programs | fallback if none</text>
  <line x1="400" y1="395" x2="400" y2="440" stroke="#27ae60" stroke-width="2" marker-end="url(#a3)"/>

  <text x="400" y="495" text-anchor="middle" font-size="9" fill="#888">DEMO DATA – NOT LEGAL ADVICE | Benefits information only</text>
</svg>
